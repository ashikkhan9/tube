<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtube Premium - Masterpiece Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; min-height: 100vh; padding-top: 130px; overflow-x: hidden; transition: background 0.3s; }
        
        body.dark-mode { background: #000; }
        body.dark-mode nav, body.dark-mode .sub-nav, body.dark-mode .card, body.dark-mode .modal-content, body.dark-mode .admin-panel { background: #0a0a0a; border-color: #222; box-shadow: none; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 9999; display: flex; justify-content: center; align-items: center; text-align: center; }
        .modal-content { background: #1e1e1e; padding: 40px; border-radius: 12px; border: 1px solid #ff3366; max-width: 400px; box-shadow: 0 0 30px rgba(255,51,102,0.3); }
        .modal-content h2 { color: #ff3366; margin-bottom: 15px; font-size: 24px; }
        .modal-content p { color: #aaa; margin-bottom: 25px; font-size: 14px; }
        .modal-btn { background: #ff3366; color: #fff; border: none; padding: 12px 25px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; }
        
        nav { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(15, 12, 41, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1000; transition: 0.3s; }
        .logo { font-size: 24px; font-weight: bold; color: #ff3366; text-decoration: none; text-shadow: 0 0 10px rgba(255,51,102,0.5); }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .search-bar { width: 100%; max-width: 200px; padding: 8px 15px; border-radius: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; outline: none; }
        .admin-toggle-btn { background: #ff3366; color: #fff; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .theme-btn { background: transparent; border: 1px solid #aaa; color: #fff; padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        
        .sub-nav { position: fixed; top: 70px; left: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 999; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; transition: 0.3s; }
        .categories { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-tag { background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; border: 1px solid transparent; transition: 0.3s; }
        .cat-tag.active, .cat-tag:hover { background: #ff3366; border-color: #ff3366; }
        .shorts-btn { background: linear-gradient(45deg, #ff0050, #00f2fe); border: none; font-weight: bold; }

        .admin-panel { max-width: 1200px; margin: 0 auto 20px; padding: 20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,51,102,0.3); border-radius: 12px; display: none; flex-direction: column; gap: 15px; }
        .admin-panel.show { display: flex; }
        .admin-panel h3 { color: #ff3366; font-size: 18px; }
        .admin-form-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .admin-input { flex: 1; min-width: 250px; padding: 10px 15px; border-radius: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; outline: none; }
        .admin-submit-btn { background: #25D366; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto 40px; padding: 0 20px; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); transition: 0.3s ease; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: rgba(255,51,102,0.3); }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; cursor: pointer; overflow: hidden; }
        .video-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.5); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        
        .delete-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; z-index: 10; display: none; }
        .card:hover .delete-btn { display: block; }

        .progress-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.2); }
        .progress-fill { height: 100%; background: #ff3366; width: 0%; box-shadow: 0 0 5px #ff3366; }
        
        .info { padding: 12px; }
        .title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #theaterMode { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; display: none; flex-direction: column; overflow-y: auto; scroll-behavior: smooth; }
        .theater-header { display: flex; justify-content: space-between; padding: 15px 20px; background: #000; position: sticky; top: 0; z-index: 2001; border-bottom: 1px solid #333; }
        .close-theater { background: transparent; border: none; color: #ff3366; font-size: 20px; cursor: pointer; }
        .theater-content { width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        #theater-container { width: 100%; aspect-ratio: 16/9; transition: 0.3s; position: relative; }
        #theater-container iframe { width: 100%; height: 100%; border: none; border-radius: 8px; background: #000; }
        
        .pip-active { position: fixed !important; bottom: 20px; right: 20px; width: 320px !important; height: 180px !important; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 2px solid #ff3366; border-radius: 8px; overflow: hidden; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 8px; flex-wrap: wrap; gap: 10px; }
        .blinking-live { color: #ff3366; font-weight: bold; font-size: 14px; animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .action-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-action { background: #25D366; color: #000; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; text-decoration: none; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-action:hover { transform: scale(1.05); }
        .btn-like { background: #ff3366; color: #fff; }
        .btn-share { background: #0088cc; color: #fff; }
        .btn-next { background: #333; color: #fff; border: 1px solid #555; }
        .btn-fullscreen { background: #fff; color: #000; }
        
        #shortsMode { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 4000; display: none; flex-direction: column; }
        .close-shorts { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #fff; padding: 8px 20px; border-radius: 20px; cursor: pointer; z-index: 4001; font-weight: bold; }
        .shorts-feed { width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; display: flex; flex-direction: column; align-items: center; }
        .short-item { width: 100%; max-width: 400px; height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: #111; border-bottom: 1px solid #333; }
        .short-item iframe { width: 100%; height: 100%; border: none; }

        .floating-tg { position: fixed; bottom: 30px; right: 30px; background: #0088cc; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 4px 20px rgba(0, 136, 204, 0.6); cursor: pointer; z-index: 1500; text-decoration: none; }
        .floating-badge { position: absolute; top: -5px; right: -5px; background: #ff3366; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); border: 1px solid #ff3366; opacity: 0; transition: 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body>

    <div id="ad-dummy" style="width: 1px; height: 1px; position: absolute; left: -9999px;"></div>

    <div id="ageModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>🔞 Age Verification</h2>
            <p>This website contains adult material. You must be 18 years or older to enter.</p>
            <button class="modal-btn" onclick="verifyAge()">I am 18+ Enter</button>
        </div>
    </div>
    <div id="adblockModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>🛑 AdBlocker Detected!</h2>
            <p>Please disable your Adblocker to watch free premium videos.</p>
            <button class="modal-btn" onclick="window.location.reload()">I Have Disabled It</button>
        </div>
    </div>

    <nav>
        <a href="#" class="logo">Xtube</a>
        <div class="nav-right">
            <input type="text" class="search-bar" id="searchInput" placeholder="Search..." onkeyup="filterVideos()">
            <button class="admin-toggle-btn" onclick="toggleAdminPanel()">⚙️ Admin Panel</button>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </nav>
    <div class="sub-nav">
        <div class="categories">
            <div class="cat-tag active">All</div>
            <div class="cat-tag shorts-btn" onclick="openShortsMode()">📱 Shorts</div>
            <div class="cat-tag">HD</div>
        </div>
    </div>

    <div style="padding-top: 130px;" id="adminPanelWrapper"></div>
    <div class="admin-panel" id="adminPanel">
        <h3>🛠️ Video Upload & Management Panel</h3>
        <div class="admin-form-group">
            <input type="text" id="videoTitleInput" class="admin-input" placeholder="Enter Video Title...">
            <input type="text" id="embedLinkInput" class="admin-input" placeholder="Paste Embed Link or ID (e.g., x3i1DfgDSI7)">
            <button class="admin-submit-btn" onclick="addNewVideo()">➕ Add Video</button>
        </div>
    </div>

    <div class="grid" id="video-grid"></div>

    <div id="theaterMode" onscroll="handlePiPScroll()">
        <div class="theater-header">
            <h3 id="theater-title" style="color: #fff;">Player</h3>
            <button class="close-theater" onclick="closeTheater()">✖ Close</button>
        </div>
        <div class="theater-content">
            <div id="theater-container"></div>
            
            <div class="action-bar">
                <div class="blinking-live">🔴 <span id="liveViewers">420</span> people watching now</div>
                <div class="action-buttons">
                    <button class="btn-action btn-like" onclick="likeVideo()">❤️ Like (<span id="likeCount">124</span>)</button>
                    <button class="btn-action btn-share" onclick="shareVideo()">🔗 Share</button>
                    <button class="btn-action btn-fullscreen" onclick="goFullscreen()">🔲 Full Screen</button>
                    <a href="https://your-adsterra-direct-link.com" target="_blank" class="btn-action" style="background:#25D366; color:#000;">⬇ HD</a>
                    <button class="btn-action btn-next" onclick="playNextVideo()">⏭ Next</button>
                </div>
            </div>
        </div>
    </div>

    <div id="shortsMode">
        <button class="close-shorts" onclick="closeShortsMode()">✖ Close Shorts</button>
        <div class="shorts-feed" id="shorts-feed"></div>
    </div>

    <div id="toast">Message</div>
    <a href="https://t.me/your_telegram" target="_blank" class="floating-tg">✈️<div class="floating-badge">Join</div></a>

    <script>
        // Official Eporner working thumbnail structure using direct CDN fallback
        let defaultVideos = [
            { id: "v1", title: "Exclusive Masterpiece HD #1", embedId: "x3i1DfgDSI7", thumb: "https://static-s.eporner.com/thumbs/static4/x3i/x3i1DfgDSI7/3_360.jpg", likes: 142 },
            { id: "v2", title: "Trending Hot Scene #2", embedId: "cJlRmiI4IOH", thumb: "https://static-s.eporner.com/thumbs/static4/cJl/cJlRmiI4IOH/3_360.jpg", likes: 230 },
            { id: "v3", title: "Amateur Special Collection #3", embedId: "xfmAGXMHLQt", thumb: "https://static-s.eporner.com/thumbs/static4/xfm/xfmAGXMHLQt/3_360.jpg", likes: 98 }
        ];

        let universalVideos = JSON.parse(localStorage.getItem('xtube_custom_videos')) || defaultVideos;
        let currentPlayingId = null;
        let progressData = JSON.parse(localStorage.getItem('xtube_progress')) || {};

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('show');
        }

        function addNewVideo() {
            let title = document.getElementById('videoTitleInput').value.trim();
            let rawInput = document.getElementById('embedLinkInput').value.trim();

            if (!rawInput) {
                showToast("Please enter an embed link or ID!");
                return;
            }

            let embedId = rawInput;
            if (rawInput.includes('eporner.com/embed/')) {
                const parts = rawInput.split('embed/');
                if (parts[1]) {
                    embedId = parts[1].split('/')[0].replace(/[^a-zA-Z0-9]/g, '');
                }
            }

            if (!title) {
                title = "Exclusive Premium Video #" + (universalVideos.length + 1);
            }

            const prefix1 = embedId.substring(0, 1);
            const prefix3 = embedId.substring(0, 3);

            const newVid = {
                id: "vid_" + Date.now(),
                title: title,
                embedId: embedId,
                thumb: `https://static-s.eporner.com/thumbs/static4/${prefix1}/${prefix3}/${embedId}/3_360.jpg`,
                likes: Math.floor(Math.random() * 150) + 20
            };

            universalVideos.unshift(newVid);
            localStorage.setItem('xtube_custom_videos', JSON.stringify(universalVideos));

            document.getElementById('videoTitleInput').value = '';
            document.getElementById('embedLinkInput').value = '';
            showToast("Video added with thumbnail successfully!");
            renderGrid(universalVideos);
        }

        function deleteVideo(id) {
            universalVideos = universalVideos.filter(v => v.id !== id);
            localStorage.setItem('xtube_custom_videos', JSON.stringify(universalVideos));
            showToast("Video deleted!");
            renderGrid(universalVideos);
        }

        function renderGrid(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            
            videos.forEach(vid => {
                const embedUrl = `https://www.eporner.com/embed/${vid.embedId}/`;
                const prog = progressData[vid.id] ? `<div class="progress-bg"><div class="progress-fill" style="width: ${progressData[vid.id]}%;"></div></div>` : '';
                
                // Fallback mechanism if primary static URL fails
                const fallbackThumb = `https://t2.hstccdn.com/contents/videos/thumbs/${vid.embedId}/3_360.jpg`;

                grid.innerHTML += `
                    <div class="card">
                        <button class="delete-btn" onclick="deleteVideo('${vid.id}')">Delete</button>
                        <div class="video-container" onclick="openTheater('${vid.id}', '${embedUrl}', '${vid.title}')">
                            <img src="${vid.thumb}" loading="lazy" alt="thumb" onerror="this.onerror=null; this.src='${fallbackThumb}';">
                            <div class="play-overlay">▶</div>
                            ${prog}
                        </div>
                        <div class="info"><div class="title">${vid.title}</div></div>
                    </div>
                `;
            });
        }

        function openTheater(id, url, title) {
            closeShortsMode();
            currentPlayingId = id;
            document.getElementById('theater-title').textContent = title;
            document.getElementById('theater-container').innerHTML = `<iframe id="main-video-frame" src="${url}" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen"></iframe>`;
            
            const currentVid = universalVideos.find(v => v.id === id);
            if(currentVid) {
                document.getElementById('likeCount').textContent = currentVid.likes || 50;
            }

            document.getElementById('theaterMode').style.display = 'flex';
        }

        function likeVideo() {
            if(!currentPlayingId) return;
            const vid = universalVideos.find(v => v.id === currentPlayingId);
            if(vid) {
                vid.likes = (vid.likes || 50) + 1;
                document.getElementById('likeCount').textContent = vid.likes;
                localStorage.setItem('xtube_custom_videos', JSON.stringify(universalVideos));
                showToast("❤️ Liked successfully!");
            }
        }

        function shareVideo() {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href);
                showToast("🔗 Video link copied to clipboard!");
            } else {
                showToast("🔗 Share link ready!");
            }
        }

        function closeTheater() {
            document.getElementById('theaterMode').style.display = 'none';
            document.getElementById('theater-container').innerHTML = '';
            renderGrid(universalVideos);
        }

        function goFullscreen() {
            const iframe = document.getElementById('main-video-frame');
            if (iframe && iframe.requestFullscreen) iframe.requestFullscreen();
        }

        function playNextVideo() {
            const nextVid = universalVideos[Math.floor(Math.random() * universalVideos.length)];
            openTheater(nextVid.id, `https://www.eporner.com/embed/${nextVid.embedId}/`, nextVid.title);
        }

        function openShortsMode() {
            closeTheater();
            const feed = document.getElementById('shorts-feed');
            feed.innerHTML = '';
            universalVideos.forEach(vid => {
                feed.innerHTML += `
                    <div class="short-item">
                        <iframe src="https://www.eporner.com/embed/${vid.embedId}/" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen" loading="lazy"></iframe>
                    </div>
                `;
            });
            document.getElementById('shortsMode').style.display = 'flex';
        }

        function closeShortsMode() {
            document.getElementById('shortsMode').style.display = 'none';
            document.getElementById('shorts-feed').innerHTML = '';
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = universalVideos.filter(v => v.title.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        document.body.addEventListener('click', function(e) {
            if(localStorage.getItem('pop_triggered') !== 'true' && e.isTrusted) {
                window.open('https://your-adsterra-popunder-link.com', '_blank');
                localStorage.setItem('pop_triggered', 'true');
            }
        }, {once: true});

        window.onload = function() {
            setTimeout(function() {
                if(localStorage.getItem('xtube_age_verified') !== 'true') {
                    document.getElementById('ageModal').style.display = 'flex';
                }
            }, 1000);
        };
        function verifyAge() {
            localStorage.setItem('xtube_age_verified', 'true');
            document.getElementById('ageModal').style.display = 'none';
        }

        renderGrid(universalVideos);
    </script>
</body>
</html>
